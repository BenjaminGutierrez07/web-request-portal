<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Login - Web Request Portal</title>
        <meta charset="UTF-8"/>
        <meta name="description" content="Inicia sesión para acceder a tus solicitudes y administrar el portal">
        <link rel="stylesheet" href="./style.css">
        <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script defer src="./supabase-client.js"></script>
        <script defer src="./login.js"></script>
    </head>
    <body class="login-page">
        <header>
            <h2>Web Request Portal</h2>
            <nav class="nav-bar">
                <a href="index.html">Home</a>
                <a href="submit-request.html">Subir Solicitud</a>
                <a href="login.html">Login</a>
            </nav>
        </header>
    
        <main>
            <section>
                <h1>Acceso de Administradores</h1>
                <h2 class="subtitulo">Ingresa tus credenciales para revisar las solicitudes</h2>
            </section>

             <section class="login-section">
                <form id="login-form" class="login-form">
                    <div class="userName">
                        <label for="email">Correo:</label>
                        <input type="email" id="email" name="email" autocomplete="username" required>
                    </div>
                    <div class="password">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <p id="login-error" role="alert"></p>
                    <div>
                        <button type="submit">Iniciar Sesión</button>
                    </div>
                </form>
            </section>
        </main>  
        
        
        <footer>
            <small>&copy; 2023 Web Request Portal. Todos los derechos reservados.</small>
        </footer>
    </body>
